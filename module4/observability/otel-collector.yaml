# OpenTelemetry Collector: the app sends OTLP here; each signal goes on to
# its store. Prometheus scrapes the collector's :8889; Loki and Tempo receive
# pushes.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Copy these resource attributes onto every metric as labels
    # (service_name, service_version), so dashboards can filter by them.
    resource_constant_labels:
      included: ["service.name", "service.version"]
    # OpenMetrics carries each counter's created timestamp; with Prometheus's
    # created-timestamp-zero-ingestion that makes increase() see the very
    # first error on a new series instead of only the second.
    enable_open_metrics: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
