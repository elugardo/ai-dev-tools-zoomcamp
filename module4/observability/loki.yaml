# Loki, single binary, local filesystem storage, receiving logs over OTLP
# from the Collector at /otlp.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      attributes_config:
        # Become stream labels; every other attribute (trace_id, order.id,
        # http.response.status_code, ...) is structured metadata.
        - action: index_label
          attributes: [service.name, service.version]

analytics:
  reporting_enabled: false
