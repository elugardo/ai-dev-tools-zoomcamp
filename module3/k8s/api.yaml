apiVersion: v1
kind: Service
metadata:
  name: agent-relay
spec:
  selector:
    app: agent-relay
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-relay
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      containers:
        - name: api
          # The tag is set in kustomization.yaml. The image is loaded into
          # kind with `kind load docker-image`, never pulled.
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            # `postgres` is the Service above; $(VAR) expands the earlier vars.
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            # On a first deploy PostgreSQL may still be pulling its image.
            - name: RELAY_DB_WAIT_SECONDS
              value: "120"
          # The process serves nothing until the database answers, so give it
          # up to 150 s before liveness starts counting.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # /ready checks the real tables, so a pod only receives traffic
          # once the database is up and the schema exists.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
