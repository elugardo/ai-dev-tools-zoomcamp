# Agent Relay on PostgreSQL.
#   docker compose up --build        # API on http://127.0.0.1:8080, PostgreSQL on 5432
#   docker compose down -v           # stop and delete the database volume
# The dev defaults below can be overridden in a .env file (gitignored).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: agent-relay:local
    environment:
      # `postgres` resolves to the service above on the Compose network.
      RELAY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@postgres:5432/${POSTGRES_DB:-relay}
    ports:
      - "${API_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
