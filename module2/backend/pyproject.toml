[project]
name = "waitwise-backend"
version = "0.1.0"
description = "WaitWise FastAPI backend (AI Dev Tools Zoomcamp, module 2)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # Raised inside Starlette's TestClient, not by WaitWise code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
